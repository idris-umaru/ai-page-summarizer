<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Page Summarizer</title>
    <link rel="stylesheet" href="../styles/popup.css">
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="header">
        <div>
          <p class="eyebrow">Current page</p>
          <h1 id="pageTitle">Loading page...</h1>
        </div>
        <span id="cacheBadge" class="badge" hidden>Cached</span>
      </header>

      <section class="controls" aria-label="Summary controls">
        <label class="field">
          <span>Summary length</span>
          <select id="summaryLength">
            <option value="short">3 bullets</option>
            <option value="medium" selected>Balanced</option>
            <option value="detailed">Detailed</option>
          </select>
        </label>

        <label class="toggle">
          <input id="highlightToggle" type="checkbox">
          <span>Highlight key points</span>
        </label>
      </section>

      <div class="actions">
        <button id="summarizeButton" class="primary" type="button">
          <span class="spinner" aria-hidden="true"></span>
          <span id="summarizeLabel">Summarize Page</span>
        </button>
        <button id="copyButton" type="button" disabled>Copy</button>
        <button id="clearButton" type="button">Clear</button>
      </div>

      <p id="statusMessage" class="status" role="status"></p>
      <p id="errorMessage" class="error" role="alert" hidden></p>

      <section id="metaPanel" class="meta" hidden>
        <div>
          <span class="meta-label">Reading time</span>
          <strong id="readingTime">-</strong>
        </div>
        <div>
          <span class="meta-label">Words scanned</span>
          <strong id="wordCount">-</strong>
        </div>
      </section>

      <section id="summaryPanel" class="summary" hidden>
        <h2>Summary</h2>
        <ul id="summaryList"></ul>

        <h2>Key insights</h2>
        <ul id="insightsList"></ul>
      </section>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
